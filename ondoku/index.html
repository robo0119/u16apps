<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recito | 英語の音読・シャドーイング練習</title>
  <meta name="description" content="Recito(レシト)は、英語の教科書や英検の英文を声に出して読む練習アプリです。音声認識で読めた単語と言えなかった単語を色分けし、正確さと速さを採点します。中学生・高校生の英語学習用。">
  <meta name="keywords" content="英語,音読,シャドーイング,発音,英検,学習,教育,中学生,高校生">
  <meta property="og:title" content="Recito | 英語の音読・シャドーイング練習">
  <meta property="og:description" content="英文を声に出して読むと、その場で採点。読めた単語は緑、言えなかった単語は赤。">
  <link rel="icon" href="../icons/ondokuchecker.png">
  <link rel="apple-touch-icon" href="../icons/ondokuchecker.png">
  <link rel="stylesheet" href="../common/style.css?v=20261105b">
  <script src="../common/gate.js?v=20261105b"></script>
  <style>
    /* --accent は文字の色、--brand は塗りの色(ボタン・上のバー)。暗い画面では文字だけ明るくする */
    :root { --accent: #142a5c; --brand: #142a5c; --serif: "Iowan Old Style", "Palatino Linotype", Georgia, "Times New Roman", serif; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --accent: #9db4ee; --brand: #2c4c9a; } }
    .topbar { background: var(--brand); }
    button { background: var(--brand); }
    button.secondary { background: var(--accent-soft); color: var(--accent); }
    main { max-width: 760px; }
    /* タブ */
    .tabs { position: sticky; top: 0; z-index: 5; display: flex; gap: 4px; padding: 6px; margin: 0 auto; max-width: 760px;
      background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    .tabs button { flex: 1; background: transparent; color: var(--muted); min-height: 44px; padding: 4px; font-weight: 700; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 0; line-height: 1.2; }
    .tabs button span { font-size: 1.15rem; }
    .tabs button small { font-size: .72rem; }
    .tabs button.on { background: var(--card); color: var(--accent); box-shadow: 0 1px 6px rgba(0,0,0,.08); }
    /* はじめに */
    .intro { display: flex; gap: 16px; align-items: center; background: linear-gradient(135deg, #142a5c, #2f4f9c); color: #fff; }
    .intro h2 { color: #fff; font-size: 1.3rem; margin: 0 0 4px; }
    .intro p { margin: 0; opacity: .9; font-size: .92rem; }
    .intro .legend { display: flex; gap: 10px; margin-top: 8px; font-family: var(--serif); font-size: 1.05rem; }
    .intro .legend b { background: rgba(255,255,255,.95); padding: 0 8px; border-radius: 6px; }
    .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    .step { background: var(--card); border-radius: 14px; padding: 10px 12px; font-size: .82rem; color: var(--muted); }
    .step b { display: block; color: var(--text); font-size: .95rem; }
    .support { background: color-mix(in srgb, var(--warn) 12%, var(--card)); }
    /* 英文 */
    .passage-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .passage-head h2 { margin: 0; flex: 1; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 4px; }
    .chip { background: var(--accent-soft); color: var(--accent); border-radius: 999px; min-height: 34px; padding: 4px 12px; font-size: .85rem; font-weight: 700; }
    .chip.on { background: var(--brand); color: #fff; }
    .ghost { background: transparent; color: var(--accent); min-height: 34px; padding: 4px 10px; font-weight: 700; }
    #pview { font-family: var(--serif); font-size: 1.45rem; line-height: 1.85; color: var(--accent); margin: 12px 0 4px; word-spacing: .05em; }
    #pview .pw { transition: color .2s, background-color .2s; border-radius: 5px; }
    #pview .read { color: var(--good); }
    #pview .miss { color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, transparent); }
    #pview .todo { color: var(--text); opacity: .75; }
    #pview .masked { color: var(--muted); letter-spacing: .02em; }
    #passage { font-family: var(--serif); font-size: 1.15rem; min-height: 200px; margin-top: 12px; }
    #progress-wrap { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 10px; }
    #progress { height: 100%; width: 0; background: var(--good); transition: width .3s; }
    /* やり方 */
    .seg { display: flex; gap: 4px; padding: 3px; border-radius: 12px; background: var(--line); margin-bottom: 16px; }
    .seg button { flex: 1; min-height: 40px; padding: 4px 6px; background: transparent; color: var(--text); font-weight: 700; border-radius: 10px; white-space: nowrap; }
    .seg button.on { background: var(--card); color: var(--accent); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
    #shadow .seg { margin: 8px 0 0; }
    /* マイク */
    .mic-area { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0; }
    #mic { width: 92px; height: 92px; border-radius: 50%; font-size: 2.3rem; padding: 0; background: var(--brand); box-shadow: 0 8px 22px color-mix(in srgb, var(--brand) 35%, transparent); transition: transform .15s; }
    #mic:active { transform: scale(.95); }
    #mic.on { background: var(--bad); box-shadow: 0 0 0 0 color-mix(in srgb, var(--bad) 45%, transparent); animation: ring 1.6s infinite; }
    #mic .stop { display: inline-block; width: 28px; height: 28px; border-radius: 6px; background: #fff; }
    @keyframes ring { 70% { box-shadow: 0 0 0 18px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
    #mic-label { font-weight: 800; color: var(--accent); }
    /* 結果 */
    .score { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
    .score-donut { width: 170px; flex: none; }
    .score-side { flex: 1; min-width: 180px; }
    .grade { font-size: 1.5rem; font-weight: 900; }
    .diff { font-weight: 700; font-size: .9rem; }
    .big { font-size: 2.8rem; font-weight: 900; line-height: 1.1; color: var(--accent); margin-top: 6px; font-variant-numeric: tabular-nums; }
    .facts { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; font-weight: 700; font-size: .9rem; }
    .donut-center { font-size: 52px !important; font-weight: 900; fill: var(--accent); }
    .pace { margin-top: 14px; }
    .pace-track { position: relative; height: 10px; border-radius: 5px; background: var(--line); }
    .pace-ok { position: absolute; left: 50%; width: 25%; top: 0; bottom: 0; background: color-mix(in srgb, var(--good) 45%, transparent); border-radius: 5px; }
    .pace-track i { position: absolute; top: -4px; width: 4px; height: 18px; margin-left: -2px; border-radius: 2px; background: var(--accent); }
    .pace-labels { position: relative; height: 16px; font-size: .7rem; color: var(--muted); }
    .pace-labels span { position: absolute; transform: translateX(-50%); }
    .pace-labels span:nth-child(1) { left: 0; transform: none; } .pace-labels span:nth-child(2) { left: 50%; } .pace-labels span:nth-child(3) { left: 75%; } .pace-labels span:nth-child(4) { right: 0; transform: none; }
    .words { font-family: var(--serif); font-size: 1.4rem; line-height: 2; margin: 6px 0 0; }
    .w-ok { color: var(--good); }
    .w-miss { color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, transparent); border-radius: 6px; padding: 0 3px; cursor: pointer; text-decoration: underline dotted; }
    .miss-chip { display: inline-flex; gap: 6px; align-items: center; margin: 4px; padding: 4px 14px; border-radius: 999px; background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad); font-weight: 700; min-height: 38px; font-family: var(--serif); font-size: 1.05rem; }
    td.sent { font-family: var(--serif); }
    .pill { display: inline-block; min-width: 52px; text-align: center; padding: 2px 8px; border-radius: 999px; font-weight: 800; background: var(--line); }
    .pill.ok { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
    .pill.ng { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
    .tip { background: color-mix(in srgb, var(--accent) 7%, var(--card)); }
    .tip p { margin: 4px 0 0; }
    /* 記録・苦手 */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
    .stat-tile { background: var(--card); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; }
    .stat-tile b { font-size: 1.7rem; color: var(--accent); line-height: 1.15; font-variant-numeric: tabular-nums; }
    .stat-tile span { font-size: .75rem; color: var(--muted); font-weight: 700; }
    .hrow { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .hpass { font-family: var(--serif); font-size: .95rem; margin-top: 2px; }
    .hnum { display: flex; flex-direction: column; align-items: flex-end; flex: none; }
    .hnum b { font-size: 1.2rem; }
    .mode-tag { font-size: .7rem; font-weight: 800; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
    .diag-name { font-size: 2rem; font-weight: 900; color: var(--bad); line-height: 1.3; }
    .diag p { margin: 4px 0 8px; }
    .weak-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 10px; }
    .weak-word { display: flex; justify-content: space-between; background: var(--bg); color: var(--text); border-radius: 12px; min-height: 44px; padding: 6px 12px; font-family: var(--serif); font-size: 1.05rem; }
    .weak-word b { color: var(--bad); font-family: inherit; font-size: .85rem; }
    .empty { text-align: center; padding: 36px 18px; }
    .big-icon { font-size: 2.6rem; }
    details.send summary { cursor: pointer; font-weight: 800; }
    /* シャドーイング */
    .sh-warn { color: #d97a00; font-weight: 700; font-size: .9rem; margin: 8px 0 0; }
    .sh-center { display: flex; flex-direction: column; align-items: center; gap: 6px; margin: 20px 0 8px; }
    .sh-center b { font-size: 1.2rem; color: var(--accent); }
    .sh-circle { width: 150px; height: 150px; border-radius: 50%; display: grid; place-items: center; font-size: 3.8rem; background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .sh-circle.speak { background: color-mix(in srgb, var(--bad) 14%, transparent); }
    .sh-circle.on { animation: sh-pulse 1.8s ease-in-out infinite; }
    @keyframes sh-pulse { 50% { transform: scale(1.06); } }
    .sh-bar { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
    .sh-bar b { width: 52px; font-size: .85rem; }
    .sh-bar .bar-track { flex: 1; }
    .sh-bar .bar-track div { height: 100%; transition: width .2s; }
    /* 練習中は英文を見せない(音だけで) */
    body.shadowing #pview, body.shadowing #passage, body.shadowing #library { filter: blur(8px); pointer-events: none; user-select: none; }
    /* 英文解釈 */
    .ip-words { font-family: var(--serif); font-size: 1.6rem; line-height: 2.2; color: var(--accent); touch-action: none; user-select: none; -webkit-user-select: none; }
    .iw { border-radius: 6px; padding: 0 3px; cursor: pointer; }
    .iw.sel { background: color-mix(in srgb, #f5c518 40%, transparent); }
    .bk { font-weight: 900; font-family: system-ui, sans-serif; }
    .bk-c { color: #3478f6; }
    .bk-p { color: #f08a24; }
    .bk-ok { color: var(--good); }
    .bk-me { color: #f08a24; }
    .bk-hint { color: var(--muted); }
    .ip-compare, .ip-serif { font-family: var(--serif); font-size: 1.3rem; line-height: 1.9; }
    .ip-serif { font-size: 1rem; }
    .big-arrow { font-size: 1.4rem; min-width: 52px; }
    .ip-toggles { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .ip-toggle { background: transparent; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); min-height: 34px; padding: 2px 12px; border-radius: 999px; font-size: .85rem; font-weight: 700; }
    .ip-toggle.on { background: var(--accent-soft); }
    .ip-wrap { position: relative; }
    .ip-wrap.with-arrows { padding-top: 26px; }
    .ip-wrap.with-arrows .ip-words { line-height: 1; row-gap: 34px; }
    .ip-arrows { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
    .ip-words { display: flex; flex-wrap: wrap; column-gap: 10px; row-gap: 16px; line-height: 1.2; }
    .iw { display: inline-flex; flex-direction: column; align-items: center; }
    .iw-sub { display: flex; gap: 3px; align-items: center; min-height: 18px; margin-top: 3px; font-family: system-ui, sans-serif; }
    .iw-sub small { font-size: .62rem; color: var(--muted); font-weight: 600; }
    .iw-to { font-family: system-ui, sans-serif; font-size: .62rem; font-weight: 800; color: #9b51e0; }
    .role { display: inline-block; min-width: 18px; text-align: center; font-family: system-ui, sans-serif; font-size: .72rem; font-weight: 900; color: #fff; border-radius: 4px; padding: 0 3px; }
    .role-S { background: #3478f6; } .role-V { background: #e2474f; } .role-O { background: #22994f; } .role-C { background: #f08a24; } .role-M { background: #9b51e0; }
    .ip-detail th { width: 6.5em; color: var(--muted); font-weight: 700; vertical-align: top; }
    .ip-word { font-family: var(--serif); font-size: 2.2rem; color: var(--accent); }
    /* チャレンジ(文字とボタンは大きく) */
    .ch-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
    .ch-head h2 { margin: 0; color: var(--accent); font-size: 1.3rem; }
    .ch-head button { white-space: nowrap; flex: none; }
    .ch-seg button { min-height: 52px; font-size: 1.1rem; }
    .ch-name { width: 100%; font-size: 1.3rem; font-weight: 800; padding: 14px; margin-bottom: 10px; border-radius: 14px; border: 2px solid color-mix(in srgb, var(--accent) 35%, transparent); background: color-mix(in srgb, var(--accent) 7%, var(--card)); }
    .ch-name.p2 { border-color: color-mix(in srgb, #f08a24 45%, transparent); background: color-mix(in srgb, #f08a24 8%, var(--card)); }
    .ch-topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-bottom: 12px; }
    .ch-topic { position: relative; text-align: left; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 16px; border-radius: 16px; background: var(--card); color: var(--accent); border: 2px solid transparent; min-height: 90px; }
    .ch-topic small { color: #f08a24; font-weight: 800; }
    .ch-topic span { font-family: var(--serif); font-size: 1.25rem; font-weight: 700; line-height: 1.35; }
    .ch-topic.on { border-color: var(--accent); background: var(--accent-soft); }
    .ch-topic i { position: absolute; top: 10px; right: 14px; font-style: normal; font-weight: 900; }
    .ch-sticky { position: sticky; bottom: 0; padding: 10px 0; background: linear-gradient(transparent, var(--bg) 30%); }
    .ch-start { width: 100%; min-height: 64px; font-size: 1.5rem; font-weight: 900; border-radius: 18px; }
    .ch-play { display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
    .ch-turn { font-size: 1.8rem; margin: 6px 0 0; color: var(--accent); }
    .ch-play.p1 .ch-turn { color: #f08a24; }
    .ch-text { font-family: var(--serif); font-size: 2.3rem; font-weight: 800; line-height: 1.45; color: var(--accent); background: var(--card); border-radius: 22px; padding: 22px; width: 100%; }
    .ch-text .read { color: var(--good); } .ch-text .miss { color: var(--bad); }
    .ch-timer { font-size: 2.6rem; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--muted); }
    .ch-mic { width: 140px; height: 140px; border-radius: 50%; font-size: 3.4rem; padding: 0; background: var(--brand); box-shadow: 0 10px 28px rgba(0,0,0,.25); }
    .ch-play.p1 .ch-mic { background: #f08a24; }
    .ch-mic.on { background: var(--bad) !important; animation: ring 1.6s infinite; }
    .ch-mic .stop { display: inline-block; width: 40px; height: 40px; border-radius: 8px; background: #fff; }
    .ch-tip { font-size: 1.25rem; font-weight: 800; color: var(--accent); margin: 0; }
    .ch-winner { text-align: center; font-size: 2.2rem; margin: 8px 0 16px; color: var(--accent); animation: pop .6s cubic-bezier(.2,1.6,.4,1) both; }
    .ch-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .ch-card { background: var(--card); border-radius: 24px; padding: 20px; text-align: center; border: 3px solid color-mix(in srgb, var(--accent) 25%, transparent); animation: pop .6s cubic-bezier(.2,1.6,.4,1) both; }
    .ch-card.p1 { border-color: color-mix(in srgb, #f08a24 35%, transparent); }
    .ch-card.crown { border-color: #f5c518; box-shadow: 0 0 0 4px color-mix(in srgb, #f5c518 30%, transparent); }
    .ch-cname { font-size: 1.4rem; color: var(--accent); }
    .ch-card.p1 .ch-cname, .ch-card.p1 .ch-title { color: #f08a24; }
    .ch-perfect { font-size: .75rem; font-weight: 900; padding: 2px 10px; border-radius: 999px; background: color-mix(in srgb, #f5c518 45%, transparent); }
    .ch-emoji { font-size: 4rem; line-height: 1.2; margin-top: 6px; }
    .ch-title { font-size: 1.9rem; font-weight: 900; color: var(--accent); }
    .ch-points { font-size: 4.6rem; font-weight: 900; line-height: 1.1; color: var(--accent); font-variant-numeric: tabular-nums; }
    .ch-stats { display: flex; justify-content: center; gap: 22px; margin-top: 10px; }
    .ch-stats b { display: block; font-size: 1.4rem; }
    .ch-stats small { color: var(--muted); }
    .ch-after { justify-content: center; margin-top: 18px; gap: 10px; }
    .ch-after button { min-height: 52px; font-size: 1.1rem; padding: 6px 20px; }
    .ch-confetti { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
    .ch-filter { width: 100%; margin-bottom: 12px; min-height: 44px; }
    .ch-rank { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .ch-place { font-size: 1.6rem; width: 44px; text-align: center; font-weight: 900; }
    .ch-rpoints { font-size: 1.5rem; color: var(--accent); font-variant-numeric: tabular-nums; }
    @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @media (max-width: 560px) {
      .tabs button small { font-size: .58rem; white-space: nowrap; }
      .tabs button { padding: 4px 0; }
      .ch-text { font-size: 1.8rem; }
      .ch-points { font-size: 3.6rem; }
      .steps { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      #pview { font-size: 1.3rem; }
      .seg button { font-size: .85rem; }
      .intro { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <picture><source srcset="../icons/ondokuchecker-dark.png" media="(prefers-color-scheme: dark)"><img src="../icons/ondokuchecker.png" alt=""></picture>
    <h1>Recito</h1>
    <a href="../">Sotaのapp</a>
  </header>
  <section id="report" class="hidden"><main></main></section>

  <div id="app">
    <nav class="tabs no-print">
      <button data-tab="practice"><span>🎤</span><small>練習</small></button>
      <button data-tab="library"><span>📚</span><small>ライブラリ</small></button>
      <button data-tab="history"><span>📈</span><small>記録</small></button>
      <button data-tab="weak"><span>🔍</span><small>苦手</small></button>
      <button data-tab="interpret"><span>📝</span><small>解釈</small></button>
      <button data-tab="challenge"><span>🏁</span><small>チャレンジ</small></button>
    </nav>
    <main>
      <section id="tab-practice">
        <div class="card intro">
          <div>
            <h2>英文を声に出して読むと、その場で採点</h2>
            <p>読めた単語は緑、飛ばした・言えなかった単語は赤。正確さと速さがわかります。</p>
            <div class="legend"><b style="color:#22994f">read</b><b style="color:#e2474f">missed</b></div>
          </div>
        </div>
        <div class="steps">
          <div class="step"><b>① 英文をえらぶ</b>見本・ライブラリ・自分で貼り付け</div>
          <div class="step"><b>② 🎤 で読む</b>読んだ所から色が変わる</div>
          <div class="step"><b>③ 暗唱ステップへ</b>覚えた単語から隠れていき、最後は暗唱</div>
        </div>
        <div class="card support hidden" id="support"></div>

        <div class="card passage-card">
          <div class="passage-head">
            <h2>英文</h2>
            <span class="muted" id="count"></span>
            <button class="ghost" id="listen">🔊 お手本</button>
            <button class="ghost" id="edit">✎ 編集</button>
          </div>
          <div class="chips"><span class="muted" style="align-self:center;font-size:.8rem">見本:</span><span id="samples" class="chips" style="margin:0"></span></div>
          <div id="pview"></div>
          <textarea id="passage" class="hidden" spellcheck="false" placeholder="英文を貼り付け"></textarea>
