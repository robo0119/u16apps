<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyPilot | Sotaのapp</title>
  <link rel="icon" href="../icons/studyplanner.png">
  <link rel="apple-touch-icon" href="../icons/studyplanner.png">
  <link rel="stylesheet" href="../common/style.css">
  <script src="../common/gate.js"></script>
  <style>
    :root { --accent: #5b4ee0; --ok: #2f9e57; --tri: #f08a24; --ng: #e2474f; --ticket: #a35ee6; }
    .tabs { position: sticky; top: 0; z-index: 5; display: flex; gap: 4px; overflow-x: auto; padding: 8px 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
    .tabs button { background: transparent; color: var(--muted); min-height: 40px; padding: 6px 14px; white-space: nowrap; }
    .tabs button.on { background: var(--accent-soft); color: var(--accent); }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; font-weight: 700; font-size: .9rem; }
    .mode-通常 { background: color-mix(in srgb, #3478f6 15%, transparent); color: #3478f6; }
    .mode-考査 { background: color-mix(in srgb, var(--ng) 15%, transparent); color: var(--ng); }
    .mode-軽め { background: color-mix(in srgb, #1aa8bf 15%, transparent); color: #1aa8bf; }
    .progress { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
    .progress i { display: block; height: 100%; border-radius: 5px; background: var(--accent); }
    .streak-row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
    .flame { text-align: center; font-weight: 800; font-size: 1.1rem; min-width: 56px; }
    .flame span { display: block; font-size: 1.8rem; line-height: 1; }
    .qrow { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .qrow:last-child { border-bottom: none; }
    .qhead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .qhead b.name { flex: 1; min-width: 120px; }
    .weak { background: color-mix(in srgb, var(--ng) 15%, transparent); color: var(--ng); border-radius: 999px; padding: 1px 8px; font-size: .75rem; font-weight: 700; }
    .chipgrid { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .pchip { min-width: 44px; min-height: 48px; padding: 2px 6px; flex-direction: column; gap: 0; border-radius: 10px; background: var(--accent-soft); color: var(--text); font-weight: 600; line-height: 1.15; }
    .pchip small { font-size: .7rem; color: var(--muted); }
    .pchip.m-○ { background: color-mix(in srgb, var(--ok) 22%, transparent); color: var(--ok); }
    .pchip.m-△ { background: color-mix(in srgb, var(--tri) 22%, transparent); color: var(--tri); }
    .pchip.m-× { background: color-mix(in srgb, var(--ng) 22%, transparent); color: var(--ng); }
    .pchip.sel { outline: 2px solid var(--accent); }
    .markbar { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .markbar button { min-height: 40px; padding: 6px 16px; }
    .b-○ { background: var(--ok) !important; } .b-△ { background: var(--tri) !important; } .b-× { background: var(--ng) !important; }
    .task { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
    .task input { width: 22px; min-height: 22px; height: 22px; margin-top: 3px; flex: none; accent-color: var(--accent); }
    .task .reason { color: var(--muted); font-size: .85rem; }
    .task.done .c { text-decoration: line-through; color: var(--muted); }
    .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
    .cal .h { font-size: .8rem; color: var(--muted); }
    .cal .d { min-height: 46px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; font-size: .95rem; }
    .cal .d small { font-size: .65rem; line-height: 1; }
    .cal .achieved { background: color-mix(in srgb, var(--ok) 40%, transparent); }
    .cal .ticket { background: color-mix(in srgb, var(--ticket) 30%, transparent); }
    .cal .missed { background: color-mix(in srgb, var(--muted) 15%, transparent); }
    .cal .today { outline: 2px solid var(--accent); font-weight: 800; }
    .legend span { display: inline-flex; align-items: center; gap: 4px; margin-right: 12px; font-size: .85rem; }
    .legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
    .tt { width: 100%; border-collapse: separate; border-spacing: 3px; }
    .tt th { text-align: center; font-size: .8rem; color: var(--muted); border: none; padding: 2px; }
    .tt td { padding: 0; border: none; }
    .tt select { min-height: 38px; padding: 2px; font-size: .8rem; text-align: center; border-radius: 8px; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 6px 4px 12px; border-radius: 999px; color: #fff; font-weight: 700; }
    .chip button { min-height: 24px; padding: 0 8px; background: rgba(255,255,255,.25); border-radius: 999px; }
    .fg { display: grid; gap: 0 12px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); align-items: end; }
    .checks label { display: inline-flex; gap: 4px; align-items: center; margin-right: 10px; color: var(--text); font-size: .95rem; }
    .checks input { width: auto; min-height: 0; }
    .mrow { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
    .mrow .grow { flex: 1; min-width: 0; }
    .route-row { display: grid; grid-template-columns: 1.4fr .7fr .7fr 1.2fr auto; gap: 6px; margin-bottom: 6px; }
    .notice { background: var(--accent-soft); border-radius: 12px; padding: 10px 14px; margin-bottom: 16px; }
    .sync-dot { font-size: .8rem; opacity: .9; }
    /* 周回 */
    .lapb { display: inline-block; font-size: .72rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; white-space: nowrap; vertical-align: middle; }
    .lapb-running { background: color-mix(in srgb, #3478f6 14%, transparent); color: #3478f6; }
    .lapb-late { background: color-mix(in srgb, var(--ng) 14%, transparent); color: var(--ng); }
    .lapb-upcoming, .lapb-finished { background: color-mix(in srgb, var(--muted) 14%, transparent); color: var(--muted); }
    .rm-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
    .rm-head { position: relative; height: 22px; margin: 14px 0 4px; font-size: .75rem; color: var(--muted); }
    .rm-tick { position: absolute; transform: translateX(-2px); border-left: 1px solid var(--line); padding-left: 3px; }
    .rm-row { margin: 6px 0 10px; }
    .rm-name { font-size: .8rem; color: var(--muted); margin-bottom: 2px; }
    .rm-track { position: relative; height: 18px; background: color-mix(in srgb, var(--line) 50%, transparent); border-radius: 5px; border-left: 2px solid var(--ng); }
    .rm-bar { position: absolute; top: 0; height: 18px; border-radius: 5px; color: #fff; font-size: .7rem; font-weight: 800; padding-left: 5px; line-height: 18px; overflow: hidden; }
    .rm-line { position: absolute; top: -3px; bottom: -3px; border-left: 1px dashed color-mix(in srgb, orange 60%, transparent); }
    @media (max-width: 520px) { .route-row { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <header class="topbar">
    <picture><source srcset="../icons/studyplanner-dark.png" media="(prefers-color-scheme: dark)"><img src="../icons/studyplanner.png" alt=""></picture>
    <h1>StudyPilot</h1>
    <span class="sync-dot" id="sync-dot"></span>
    <a href="../">Sotaのapp</a>
  </header>
  <nav class="tabs" id="tabs">
    <button data-act="tab" data-tab="today">今日</button>
    <button data-act="tab" data-tab="materials">教材</button>
    <button data-act="tab" data-tab="calendar">カレンダー</button>
    <button data-act="tab" data-tab="analysis">分析</button>
    <button data-act="tab" data-tab="setup">登録</button>
  </nav>
  <main id="view"></main>
  <footer>データはこのブラウザと、ログインしていれば Firebase(本人だけが読み書きできる場所)に保存されます。</footer>

  <script src="../common/bridge.js"></script>
  <script src="../common/charts.js"></script>
  <script src="../common/firebase-config.js"></script>
  <script src="engine.js"></script>
  <script src="store.js"></script>
  <script src="../common/sync.js"></script>
  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
