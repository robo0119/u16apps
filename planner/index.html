<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyPilot | Sotaのapp</title>
  <link rel="icon" href="../icons/studyplanner.png">
  <link rel="apple-touch-icon" href="../icons/studyplanner.png">
  <link rel="stylesheet" href="../common/style.css">
  <style>
    :root { --accent: #5b4ee0; }
    .tt { width: 100%; border-collapse: separate; border-spacing: 4px; }
    .tt th { text-align: center; font-size: .85rem; color: var(--muted); border: none; padding: 2px; }
    .tt td { padding: 0; border: none; }
    .tt select { min-height: 40px; padding: 4px; font-size: .85rem; text-align: center; border-radius: 8px; }
    .tt .cell { min-height: 40px; border-radius: 8px; color: #fff; font-size: .85rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 6px 4px 12px; border-radius: 999px; color: #fff; font-weight: 700; }
    .chip button { min-height: 24px; padding: 0 8px; background: rgba(255,255,255,.25); border-radius: 999px; }
    .form-grid { display: grid; gap: 0 12px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); align-items: end; }
    .task { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .task .check { font-size: 1.4rem; line-height: 1; }
    .task .reason { color: var(--muted); font-size: .85rem; }
    .formula td { padding: 4px 6px; }
    .notice { background: var(--accent-soft); border-radius: 12px; padding: 10px 14px; margin-bottom: 16px; }
    .subject-checks label { display: inline-flex; gap: 4px; align-items: center; margin-right: 10px; color: var(--text); }
    .subject-checks input { width: auto; min-height: 0; }
  </style>
</head>
<body>
  <header class="topbar">
    <picture><source srcset="../icons/studyplanner-dark.png" media="(prefers-color-scheme: dark)"><img src="../icons/studyplanner.png" alt=""></picture>
    <h1>StudyPilot</h1>
    <a href="../">Sotaのapp</a>
  </header>

  <main>
    <!-- アプリから共有された今日の計画 -->
    <section id="report" class="hidden"></section>

    <!-- 入力(エディター) -->
    <section id="editor">
      <div class="app-banner no-print">
        <picture><source srcset="../icons/studyplanner-dark.png" media="(prefers-color-scheme: dark)"><img src="../icons/studyplanner.png" alt=""></picture>
        <div><b>PCでまとめて入力</b><br><span class="muted">QRコードでアプリへ</span></div>
      </div>
      <div id="loaded-notice" class="notice hidden"></div>

      <div class="card">
        <h2>教科</h2>
        <div class="chips" id="subjects"></div>
        <div class="row">
          <input id="new-subject" placeholder="教科を追加(例:数学)" style="flex:1;min-width:160px">
          <button id="add-subject">追加</button>
          <button class="secondary" id="five-subjects">5教科を入れる</button>
        </div>
      </div>

      <div class="card">
        <div class="row" style="justify-content:space-between"><h2 style="margin:0">時間割</h2>
          <label style="margin:0">1日 <select id="periods" style="width:auto"></select> 時間目まで</label></div>
        <div style="overflow-x:auto"><table class="tt" id="timetable"></table></div>
      </div>

      <div class="card">
        <h2>生活時間</h2>
        <div class="form-grid">
          <div><label>起きる</label><input type="time" id="wake"></div>
          <div><label>寝る</label><input type="time" id="sleep"></div>
          <div><label>学校が始まる</label><input type="time" id="schoolStart"></div>
          <div><label>学校が終わる</label><input type="time" id="schoolEnd"></div>
          <div><label>通学(片道・分)</label><input type="number" id="commute" min="0" step="5"></div>
          <div><label>食事・お風呂など(分)</label><input type="number" id="living" min="0" step="10"></div>
        </div>
      </div>

      <div class="card">
        <h2>毎週の予定(部活・塾)</h2>
        <table id="weekly-table"></table>
        <div class="form-grid" style="margin-top:8px">
          <div><label>名前</label><input id="w-title" value="部活"></div>
          <div><label>曜日</label><select id="w-day"></select></div>
          <div><label>始まり</label><input type="time" id="w-start" value="16:10"></div>
          <div><label>終わり</label><input type="time" id="w-end" value="18:30"></div>
          <div><button id="add-weekly">追加</button></div>
        </div>
      </div>

      <div class="card">
        <h2>1週間の勉強時間の見通し</h2>
        <p class="muted">勉強時間 = 起きている時間 − 学校 − 予定 − 食事など − 休憩(空き時間の1/6)。アプリと同じ計算です。</p>
        <div id="week-forecast"></div>
      </div>

      <div class="card">
        <h2>テスト・模試・行事</h2>
        <table id="events-table"></table>
        <div class="form-grid" style="margin-top:8px">
          <div><label>種類</label><select id="e-kind"><option>定期テスト</option><option>模試</option><option>行事</option></select></div>
          <div><label>名前</label><input id="e-title" value="期末テスト"></div>
          <div><label>日にち</label><input type="date" id="e-date"></div>
        </div>
        <label>テストの教科(選ばなければ全教科)</label>
        <div class="subject-checks" id="e-subjects"></div>
        <div class="row" style="margin-top:8px"><button id="add-event">追加</button></div>
      </div>

      <div class="card">
        <h2>テストの結果</h2>
        <table id="scores-table"></table>
        <div class="form-grid" style="margin-top:8px">
          <div><label>テストの名前</label><input id="s-test" value="中間テスト"></div>
          <div><label>日にち</label><input type="date" id="s-date"></div>
          <div><label>満点</label><input type="number" id="s-max" value="100"></div>
        </div>
        <div class="form-grid" id="s-inputs"></div>
        <div class="row" style="margin-top:8px"><button id="add-scores">結果を追加</button></div>
      </div>

      <div class="card no-print">
        <h2>アプリに送る</h2>
        <div id="send"></div>
        <p class="muted">アプリにある予定や成績は消えません。同じものは二重に入りません。Webで消したものは、アプリでは消えないので、アプリで消してください。</p>
      </div>
    </section>
  </main>
  <footer>Sotaのapp</footer>

  <script src="../common/qr.js"></script>
  <script src="../common/bridge.js"></script>
  <script src="../common/charts.js"></script>
  <script src="app.js"></script>
</body>
</html>
