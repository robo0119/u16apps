<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sotaのapp | 中学生・高校生のための学習アプリ</title>
  <meta name="description" content="中学生・高校生が自分で作った学習アプリ集です。英語の音読練習(Recito)、学習計画(StudyPilot)、テストのミス分析(Errata)、おこづかい帳(Coinvoice)。">
  <meta name="keywords" content="学習,勉強,教育,中学生,高校生">
  <link rel="stylesheet" href="common/style.css">
  <script src="common/gate.js"></script>
  <style>
    :root { --accent: #3b3f8f; }
    .hero { text-align: center; padding: 40px 16px 16px; }
    .hero h1 { margin: 0; font-size: 2.2rem; letter-spacing: .02em; }
    .apps { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
    .app { display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: inherit; transition: transform .15s; }
    .app:hover { transform: translateY(-3px); }
    .app img { width: 72px; height: 72px; border-radius: 18px; }
    .app h2 { margin: 6px 0 0; font-size: 1.2rem; }
    .app .role { font-size: .9rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Sotaのapp</h1>
    <p class="muted">iPhoneで記録して、Webで見る。</p>
  </div>
  <main>
    <div class="apps">
      <a class="card app" href="ondoku/">
        <picture><source srcset="icons/ondokuchecker-dark.png" media="(prefers-color-scheme: dark)"><img src="icons/ondokuchecker.png" alt=""></picture>
        <h2>Recito</h2>
        <span class="role">英語の音読を採点</span>
      </a>
      <a class="card app" href="missnote/">
        <picture><source srcset="icons/missnote-dark.png" media="(prefers-color-scheme: dark)"><img src="icons/missnote.png" alt=""></picture>
        <h2>Errata</h2>
        <span class="role">ミスのくせを分析</span>
      </a>
      <a class="card app" href="okozukai/">
        <picture><source srcset="icons/okozukai-dark.png" media="(prefers-color-scheme: dark)"><img src="icons/okozukai.png" alt=""></picture>
        <h2>Coinvoice</h2>
        <span class="role">声でおこづかい記録</span>
      </a>
      <a class="card app" href="planner/">
        <picture><source srcset="icons/studyplanner-dark.png" media="(prefers-color-scheme: dark)"><img src="icons/studyplanner.png" alt=""></picture>
        <h2>StudyPilot</h2>
        <span class="role">今日の勉強を自動で計画</span>
      </a>
    </div>
  </main>
  <footer>データはサーバーに保存しません</footer>
</body>
</html>
